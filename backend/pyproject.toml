[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"apps/users/migrations/*" = ["E501"] #pra ignorar as migrations
"core/settings.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"