[project]
name = "readrats"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django==6.0.5",
    "django-ninja==1.6.2",
    "django-ninja-extra==0.31.4",
    "django-ninja-jwt==5.4.4",
    "email-validator==2.3.0",
    "pytest==9.0.3",
    "pytest-django==4.12.0",
    "Deprecated==1.3.1",
    "ruff==0.15.13",
    "pylint==4.0.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"apps/users/migrations/*" = ["E501"] #pra ignorar as migrations
"core/settings.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"