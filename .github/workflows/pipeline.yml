name: ReadRats Workflow

on:
    push:
        branches: ['**']
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4 #vai pegar o codigo do repositorio
            - uses: actions/setup-python@v5 
              with:
                python-version: '3.12'
            - run: pip install -r backend/requirements.txt
            - name: check deprecated code
              run: |
                cd backend
                flake8 .
            - run: cd backend && python -m pytest tests/test_community.py -v