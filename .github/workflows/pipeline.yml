name: ReadRats Workflow

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 #vai pegar o codigo do repositorio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: check deprecated code
        run: |
          cd backend
          pytest -v -W error::DeprecationWarning
      - name: checar padrão de codificação com Ruff
        run: |
           cd backend
           ruff format .
           ruff check . --fix
      - name: detectar código duplicado & Code smells
        run: |
          cd backend
          pylint \
            --disable=all \
            --enable=R0801,C0114,C0115,C0116 \
            --min-similarity-lines=2 \
            --ignore-paths='.*migrations.*' \
            .

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout do código
        uses: actions/checkout@v6

      - name: executar OWASP dependency check
        uses: dependency-check/DependencyCheck_Action@main
        id: depcheck
        with:
          project: 'ReadRats'
          format: 'HTML'
          args: |
            --scan ./backend
            --enableExperimental
            --out ./reports

      - name: Fazer upload do relatório de segurança
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports

  generate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: instalar uv e gerar lock file
        run: |
          pip install uv
          cd backend
          uv lock
      - name: commitar uv.lock se foi gerado ou alterado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git diff --staged --quiet || git commit -m "ci: atualizar uv.lock"
          git push

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
